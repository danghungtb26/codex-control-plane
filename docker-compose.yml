services:
  dashboard:
    build:
      context: .
    environment:
      CORE_URL: ${CORE_URL:-http://host.docker.internal:8787}
      CADDY_AUTH_USERNAME: ${CADDY_AUTH_USERNAME:-admin}
      CADDY_AUTH_PASSWORD: ${CADDY_AUTH_PASSWORD:-}
      CADDY_AUTH_PASSWORD_HASH: ${CADDY_AUTH_PASSWORD_HASH:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${CADDY_PORT:-8080}:8080"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://dashboard:8080
    depends_on:
      - dashboard
    restart: unless-stopped
